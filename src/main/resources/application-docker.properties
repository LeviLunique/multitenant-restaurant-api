server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/restaurant_hub}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:restaurant_hub}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:restaurant_hub}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

spring.jpa.properties.hibernate.default_schema=${APP_DATABASE_SCHEMA:restaurant_hub}
spring.flyway.default-schema=${APP_DATABASE_SCHEMA:restaurant_hub}
spring.flyway.schemas=${APP_DATABASE_SCHEMA:restaurant_hub}

spring.h2.console.enabled=false
