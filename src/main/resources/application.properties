spring.application.name=multitenant-restaurant-api

spring.datasource.url=jdbc:h2:mem:restaurant_hub;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=restaurant_hub
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=restaurant_hub
spring.flyway.schemas=restaurant_hub
spring.flyway.create-schemas=true
spring.flyway.clean-disabled=true

spring.h2.console.enabled=true

server.error.include-message=never
