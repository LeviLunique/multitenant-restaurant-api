name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - "feature/**"
      - "bugfix/**"
      - "fix/**"
      - "hotfix/**"
      - "release/**"
      - "chore/**"
      - "refactor/**"
      - "test/**"
      - "docs/**"
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test and Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build with Maven
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: |
            target/site/jacoco
            target/surefire-reports

  sonar-analysis:
    name: Sonar Analysis
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect Sonar configuration
        id: sonar-config
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          if [[ -z "${SONAR_TOKEN}" || -z "${SONAR_PROJECT_KEY}" ]]; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "mode=disabled" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ -n "${SONAR_HOST_URL}" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
            echo "mode=server" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ -n "${SONAR_ORGANIZATION}" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
            echo "mode=cloud" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "enabled=false" >> "${GITHUB_OUTPUT}"
          echo "mode=disabled" >> "${GITHUB_OUTPUT}"

      - name: Skip Sonar analysis
        if: ${{ steps.sonar-config.outputs.enabled != 'true' }}
        run: echo "Sonar analysis skipped because SONAR_TOKEN and project settings are not fully configured."

      - name: Set up JDK 21
        if: ${{ steps.sonar-config.outputs.enabled == 'true' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: SonarQube Server analysis
        if: ${{ steps.sonar-config.outputs.mode == 'server' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: >
          mvn --batch-mode --no-transfer-progress verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=${SONAR_PROJECT_KEY}
          -Dsonar.host.url=${SONAR_HOST_URL}
          -Dsonar.qualitygate.wait=true

      - name: SonarQube Cloud analysis
        if: ${{ steps.sonar-config.outputs.mode == 'cloud' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_REGION: ${{ vars.SONAR_REGION }}
        shell: bash
        run: |
          SONAR_ARGS=(
            "--batch-mode"
            "--no-transfer-progress"
            "verify"
            "org.sonarsource.scanner.maven:sonar-maven-plugin:sonar"
            "-Dsonar.projectKey=${SONAR_PROJECT_KEY}"
            "-Dsonar.organization=${SONAR_ORGANIZATION}"
            "-Dsonar.qualitygate.wait=true"
          )

          if [[ "${SONAR_REGION}" == "us" ]]; then
            SONAR_ARGS+=("-Dsonar.region=us")
          fi

          mvn "${SONAR_ARGS[@]}"
